name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check src tests
      - name: Unit tests with coverage (unit suite only)
        run: pytest tests/unit --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  postgres:
    # The same unit and integration suites on Postgres (omarchy_db's --pg), since production runs there and tests default to SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMARCHY_DB_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest tests/unit --pg -n auto
      - run: pytest tests/integration --pg -n auto

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests with coverage (unit project only)
        run: npm run test:coverage
      - name: Coverage gate (unit + jsdom component tests together, floors in web/coverage-floor.json)
        run: npm run test:coverage:gate -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Build
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook

  visual:
    name: Visual regression (Storybook and the app's routes in Chromium, light and dark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The Chromium pinned by package.json's exact playwright version: the one the baselines were written in.
      - run: npx playwright install --with-deps chromium
      # strata-visual (from strata-react) screenshots every story and every route state in strata-visual.config.ts
      # and compares them with tests/visual/baselines/ (pixelmatch).
      - run: npm run test:visual
      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: web/tests/visual/output/
          if-no-files-found: ignore
